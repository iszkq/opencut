name: 功能建议
description: 提交具体、可理解的使用需求
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样使用？
      description: 请描述操作流程、期望界面或参考产品。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案或参考资料
    validations:
      required: false
